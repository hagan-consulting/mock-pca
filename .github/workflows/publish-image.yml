# Publish image: called by ci.yml after its checks pass on a push to main or a
# release tag vX.Y.Z. Builds the container image natively on linux/amd64 and
# linux/arm64 runners, pushes each by digest with BuildKit provenance
# (mode=max) and an SBOM, smoke-tests the pushed image with
# scripts/container-test.sh, combines both into one multi-arch image, attests
# its build provenance and finally applies the retention policy to the GHCR
# package (tools/ghcr-prune). Tags: main gets edge and sha-<short>; a release
# tag gets X.Y.Z, X.Y, latest and sha-<short>.
#
# ci.yml runs this whole workflow in the ghcr-publish-mock-pca concurrency
# group (queue: max), so only one publish touches the package at a time and
# the prune never sees another run's per-architecture images before they are
# combined.
#
# Supply-chain rules (see CLAUDE.md): top-level permissions are empty and each
# job gets only what it needs; checkouts do not persist credentials; actions
# are pinned to full commit SHAs (updated by Dependabot); the BuildKit and
# SBOM scanner images are pinned by digest (updated by hand: release public for
# at least a week, digest read from the registry and checked against Docker
# Hub's tag listing); the published image is built without caches. Only tags
# on commits that are on main, with a matching CHANGELOG section, are
# published as releases. The image that is pushed is the image that was
# tested.
name: Publish image

on:
  workflow_call:

permissions: {}

env:
  # GHCR names must be lower case (the GitHub owner is Hagan-Consulting).
  IMAGE: ghcr.io/hagan-consulting/mock-pca
  GOTOOLCHAIN: local
  # moby/buildkit v0.34.1, Docker Hub, pushed 2026-10-20.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
  # docker/buildkit-syft-scanner 1.12.1, Docker Hub, pushed 2026-10-26.
  SBOM_GENERATOR: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
  # main: edge + sha-<short>; vX.Y.Z tags: X.Y.Z, X.Y, sha-<short> and latest
  # (flavor latest=auto, semver tags only).
  META_TAGS: |
    type=edge,branch=main
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=sha
  META_LABELS: |
    org.opencontainers.image.title=mock-pca
    org.opencontainers.image.description=Development-only mock of the NG9-1-1 PCA PKI. NOT FOR PRODUCTION.

jobs:
  verify:
    name: verify the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CHANGELOG.md has a section for the version
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -Eq "^## \[${GITHUB_REF_NAME#v}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md

  build:
    name: build, push and test (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      # One output per architecture; matrix job outputs are combined.
      digest_amd64: ${{ steps.digest.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.digest.outputs.digest_arm64 }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native runner
        run: '[[ $(uname -m) == "$(case $ARCH in amd64) echo x86_64 ;; arm64) echo aarch64 ;; esac)" ]]'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.META_TAGS }}
          labels: ${{ env.META_LABELS }}
      # Pushed by digest only (no tag): the merge job tags the combined image.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # BuildKit SLSA provenance and SBOM, stored in GHCR next to the image.
          provenance: mode=max
          attests: type=sbom,generator=${{ env.SBOM_GENERATOR }}
          no-cache: true
      - name: Digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest_$ARCH=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$DIGEST (linux/$ARCH)"
      - name: Smoke-test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform "linux/$ARCH" "$IMAGE@$DIGEST"
          bash scripts/container-test.sh "$IMAGE@$DIGEST"

  merge:
    name: publish the multi-arch image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.META_TAGS }}
          labels: ${{ env.META_LABELS }}
      # docker buildx as preinstalled on the runner image; imagetools needs no
      # builder.
      - name: Create the multi-arch tags
        id: index
        env:
          DIGEST_AMD64: ${{ needs.build.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ needs.build.outputs.digest_arm64 }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          for d in "$DIGEST_AMD64" "$DIGEST_ARM64"; do [[ $d =~ ^sha256:[0-9a-f]{64}$ ]]; done
          mapfile -t tags < <(grep . <<<"$TAGS")
          mapfile -t annotations < <(grep . <<<"$ANNOTATIONS" || true)
          args=()
          for t in "${tags[@]}"; do
            [[ $t =~ ^${IMAGE//./\\.}:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "unexpected tag: $t" >&2; exit 1; }
            args+=(--tag "$t")
          done
          (( ${#tags[@]} > 0 ))
          for a in "${annotations[@]}"; do args+=(--annotation "$a"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST_AMD64" "$IMAGE@$DIGEST_ARM64"
          raw="$(docker buildx imagetools inspect --raw "${tags[0]}")"
          platforms="$(jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(" ")' <<<"$raw")"
          [[ $platforms == "linux/amd64 linux/arm64" ]] || { echo "unexpected platforms: $platforms" >&2; exit 1; }
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${tags[0]}" | jq -r .digest)"
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$digest as ${tags[*]#"$IMAGE:"}: linux/amd64 $DIGEST_AMD64, linux/arm64 $DIGEST_ARM64"

  attest:
    # On by default (the repository is public). Set the repository variable
    # ATTEST_IMAGES=false to skip it, e.g. if the repository becomes private
    # without GitHub Enterprise Cloud.
    name: attest build provenance
    if: vars.ATTEST_IMAGES != 'false'
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # actions/attest has no credential input: with push-to-registry it reads
      # the login from ~/.docker/config.json, which login-action writes and
      # removes again in its post step.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true

  prune:
    # Retention: tags other than sha-* (releases, latest, edge) are kept,
    # sha-*-only images for at least 14 days, untagged manifests only while a
    # kept image needs them. Runs after the attestation (or its skip), and
    # not after a failed or cancelled publish.
    name: prune the registry
    needs: [merge, attest]
    if: >-
      !cancelled() && needs.merge.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No restored caches in a job holding packages: write.
          cache: false
      - name: Prune registry
        run: go run ./tools/ghcr-prune -org hagan-consulting -package mock-pca
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
